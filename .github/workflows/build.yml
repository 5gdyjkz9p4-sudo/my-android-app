name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          mkdir -p extracted_temp
          unzip -o *.zip -d extracted_temp
          
          # 寻找 build.gradle 所在目录
          BUILD_FILE=$(find extracted_temp -name "build.gradle*" -type f | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
            if [ "$(basename "$PROJECT_DIR")" = "app" ]; then
              PROJECT_DIR=$(dirname "$PROJECT_DIR")
            fi
            echo "找到项目根目录: $PROJECT_DIR"
            shopt -s dotglob
            cp -r "$PROJECT_DIR"/* .
          else
            shopt -s dotglob
            cp -r extracted_temp/* .
          fi
          rm -rf extracted_temp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "未检测到 gradlew，正在自动生成兼容版 Gradle 8.5..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
