name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          mkdir -p extracted_temp
          unzip -o *.zip -d extracted_temp
          GRADLEW_PATH=$(find extracted_temp -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "找到 gradlew 所在目录: $PROJECT_DIR"
            shopt -s dotglob
            cp -r "$PROJECT_DIR"/* .
          else
            echo "未找到 gradlew，移动所有解压文件"
            shopt -s dotglob
            cp -r extracted_temp/* .
          fi
          rm -rf extracted_temp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
